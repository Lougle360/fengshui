  <text x="323" y="343" font-size="20" font-family="Microsoft YaHei, sans-serif">拟取点</text>
  <circle cx="350" cy="285" r="17" fill="#155eef"/><text x="344" y="292" font-size="18" font-family="sans-serif" fill="white">2</text>
  <path d="M342 160 C265 150,195 120,110 78" fill="none" stroke="#c83232" stroke-width="14" marker-end="url(#r)"/>
  <path d="M358 215 C445 205,530 165,625 112" fill="none" stroke="#c83232" stroke-width="14" marker-end="url(#r)"/>
  <text x="40" y="120" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#a62525">腰肋支形向外分走</text>
  <circle cx="225" cy="155" r="17" fill="#155eef"/><text x="219" y="162" font-size="18" font-family="sans-serif" fill="white">3</text>
  <text x="470" y="95" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#a62525">另一支继续外泄</text>
  <circle cx="510" cy="185" r="17" fill="#155eef"/><text x="504" y="192" font-size="18" font-family="sans-serif" fill="white">4</text>
  <path d="M270 395 Q350 425 430 395" fill="none" stroke="#18864b" stroke-width="8" stroke-dasharray="12 8"/>
  <text x="250" y="450" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#126f3d">若两侧回护，才与外泄形成对照</text>
  <text x="28" y="420" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#666">可确认：主体与外分支的关系。不可由示意认定唯一穴位或灾应。</text>
