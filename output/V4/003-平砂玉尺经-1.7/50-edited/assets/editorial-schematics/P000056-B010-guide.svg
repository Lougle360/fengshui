  <path d="M350 75 C330 135,365 190,350 300" fill="none" stroke="#6b4f2a" stroke-width="20" stroke-linecap="round"/>
  <circle cx="350" cy="105" r="17" fill="#155eef"/><text x="344" y="112" font-size="18" font-family="sans-serif" fill="white">1</text>
